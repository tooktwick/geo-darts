<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="castle-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="castle-roof" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="castle-stone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="castle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景円 -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="url(#castle-gold)" stroke-width="2" filter="url(#castle-glow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- 金鯱 (最上部左右) -->
  <path d="M26 14 C25 11, 28 9, 29 11 C29 12, 28 13, 28 14 Z" fill="url(#castle-gold)"/>
  <path d="M38 14 C39 11, 36 9, 35 11 C35 12, 36 13, 36 14 Z" fill="url(#castle-gold)"/>

  <!-- 天守閣 最上層屋根 -->
  <path d="M32 12 L22 17 C25 17, 29 17, 32 16 C35 17, 39 17, 42 17 Z" fill="url(#castle-roof)" stroke="#94a3b8" stroke-width="0.5"/>
  <rect x="27" y="17" width="10" height="6" fill="#f8fafc" stroke="#334155" stroke-width="0.5"/>
  <rect x="30" y="18" width="4" height="4" fill="#0f172a"/>

  <!-- 二層目屋根 (反り破風) -->
  <path d="M32 22 L17 28 C23 27, 27 27, 32 26 C37 27, 41 27, 47 28 Z" fill="url(#castle-roof)" stroke="#94a3b8" stroke-width="0.5"/>
  <rect x="23" y="28" width="18" height="7" fill="#f8fafc" stroke="#334155" stroke-width="0.5"/>
  <rect x="26" y="29.5" width="3" height="4" fill="#0f172a"/>
  <rect x="35" y="29.5" width="3" height="4" fill="#0f172a"/>

  <!-- 三層目屋根 (大破風) -->
  <path d="M32 34 L12 41 C20 40, 26 40, 32 39 C38 40, 44 40, 52 41 Z" fill="url(#castle-roof)" stroke="#94a3b8" stroke-width="0.5"/>
  
  <!-- 天守台・石垣 (武者返し) -->
  <path d="M19 41 L15 54 C26 55, 38 55, 49 54 L45 41 Z" fill="url(#castle-stone)" stroke="#cbd5e1" stroke-width="0.5"/>
  <!-- 石垣テクスチャ -->
  <path d="M18 45 L46 45 M16 49 L48 49 M26 41 L25 45 M38 41 L39 45 M22 45 L21 49 M34 45 L35 49 M30 49 L29 54 M42 49 L43 54" stroke="#1e293b" stroke-width="0.8" opacity="0.6"/>

  <!-- 金彩アクセント飾り -->
  <circle cx="32" cy="14" r="1.5" fill="url(#castle-gold)"/>
</svg>
