<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="fan-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="fan-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="culture-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 背景円 -->
  <circle cx="32" cy="32" r="30" fill="#0b0f19" stroke="#6366f1" stroke-width="2" filter="url(#culture-glow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#818cf8" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- 和扇子 (末広がり) -->
  <!-- 扇面 (広げた扇) -->
  <path d="M32 46 L10 26 C15 15, 49 15, 54 26 Z" fill="url(#fan-paper)" stroke="#a5b4fc" stroke-width="0.8"/>
  
  <!-- 扇の骨 (竹骨) -->
  <line x1="32" y1="46" x2="10" y2="26" stroke="url(#fan-gold)" stroke-width="1.2"/>
  <line x1="32" y1="46" x2="18" y2="21" stroke="#c7d2fe" stroke-width="0.8"/>
  <line x1="32" y1="46" x2="27" y2="18" stroke="#c7d2fe" stroke-width="0.8"/>
  <line x1="32" y1="46" x2="37" y2="18" stroke="#c7d2fe" stroke-width="0.8"/>
  <line x1="32" y1="46" x2="46" y2="21" stroke="#c7d2fe" stroke-width="0.8"/>
  <line x1="32" y1="46" x2="54" y2="26" stroke="url(#fan-gold)" stroke-width="1.2"/>

  <!-- 扇面の金彩絵柄 (流水と桜) -->
  <path d="M22 28 Q32 23 42 28" fill="none" stroke="url(#fan-gold)" stroke-width="1.5"/>
  <circle cx="32" cy="24" r="3" fill="url(#fan-gold)"/>

  <!-- 要 (かなめ) -->
  <circle cx="32" cy="46" r="3.5" fill="url(#fan-gold)" stroke="#312e81" stroke-width="0.8"/>
  <circle cx="32" cy="46" r="1.5" fill="#312e81"/>

  <!-- 房飾り (タッセル) -->
  <path d="M32 49 Q31 55 29 58 M32 49 Q33 55 35 58" stroke="#e0e7ff" stroke-width="1.2" stroke-linecap="round"/>
</svg>
