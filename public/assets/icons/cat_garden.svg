<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sakura-petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="bridge-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="garden-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ec4899" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 背景円 -->
  <circle cx="32" cy="32" r="30" fill="#1b0c16" stroke="#ec4899" stroke-width="2" filter="url(#garden-glow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#f472b6" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- 枯山水・水面の波紋 (下部) -->
  <path d="M8 48 Q32 42 56 48" fill="none" stroke="#fbcfe8" stroke-width="0.8" opacity="0.4"/>
  <path d="M12 52 Q32 46 52 52" fill="none" stroke="#fbcfe8" stroke-width="0.8" opacity="0.3"/>

  <!-- 朱塗りの太鼓橋 (反り橋) -->
  <path d="M14 46 Q32 30 50 46 L48 49 Q32 35 16 49 Z" fill="url(#bridge-red)" stroke="#fca5a5" stroke-width="0.5"/>
  <!-- 橋の欄干・擬宝珠 (ぎぼし) -->
  <path d="M15 44 Q32 28 49 44" fill="none" stroke="#fde047" stroke-width="1.2"/>
  <circle cx="21" cy="38" r="1.2" fill="#fde047"/>
  <circle cx="32" cy="33.5" r="1.5" fill="#fde047"/>
  <circle cx="43" cy="38" r="1.2" fill="#fde047"/>

  <!-- 石灯籠 (右側) -->
  <rect x="42" y="38" width="4" height="6" fill="#64748b"/>
  <polygon points="40,38 48,38 44,35" fill="#94a3b8"/>
  <rect x="43" y="36.5" width="2" height="1.5" fill="#fde047"/>

  <!-- 満開の五弁桜 (大輪) -->
  <g transform="translate(30, 20) scale(0.9)">
    <!-- 5つの花びら (ハート切り欠き) -->
    <!-- 上 -->
    <path d="M0 0 C-4 -6, -4 -12, 0 -15 C4 -12, 4 -6, 0 0 Z" fill="url(#sakura-petal)" stroke="#fdf2f8" stroke-width="0.4"/>
    <!-- 右上 -->
    <path d="M0 0 C-4 -6, -4 -12, 0 -15 C4 -12, 4 -6, 0 0 Z" fill="url(#sakura-petal)" stroke="#fdf2f8" stroke-width="0.4" transform="rotate(72)"/>
    <!-- 右下 -->
    <path d="M0 0 C-4 -6, -4 -12, 0 -15 C4 -12, 4 -6, 0 0 Z" fill="url(#sakura-petal)" stroke="#fdf2f8" stroke-width="0.4" transform="rotate(144)"/>
    <!-- 左下 -->
    <path d="M0 0 C-4 -6, -4 -12, 0 -15 C4 -12, 4 -6, 0 0 Z" fill="url(#sakura-petal)" stroke="#fdf2f8" stroke-width="0.4" transform="rotate(216)"/>
    <!-- 左上 -->
    <path d="M0 0 C-4 -6, -4 -12, 0 -15 C4 -12, 4 -6, 0 0 Z" fill="url(#sakura-petal)" stroke="#fdf2f8" stroke-width="0.4" transform="rotate(288)"/>
    <!-- 雌しべ・雄しべ (中央) -->
    <circle cx="0" cy="0" r="2.5" fill="#fde047"/>
  </g>

  <!-- 舞い散る花びら (風情ある散り桜) -->
  <path d="M15 16 C13 13, 16 11, 18 13 C17 15, 14 17, 15 16 Z" fill="#f472b6" opacity="0.85"/>
  <path d="M47 14 C45 12, 47 9, 49 11 C49 13, 46 15, 47 14 Z" fill="#fbcfe8" opacity="0.9"/>
  <path d="M18 29 C16 27, 18 25, 20 26 C19 28, 17 30, 18 29 Z" fill="#f472b6" opacity="0.7"/>
</svg>
