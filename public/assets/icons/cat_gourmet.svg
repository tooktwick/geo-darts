<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bowl-body" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="soup-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="gourmet-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ea580c" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- 背景円 -->
  <circle cx="32" cy="32" r="30" fill="#180e05" stroke="#ea580c" stroke-width="2" filter="url(#gourmet-glow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#fb923c" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- 立ち上る湯気 (美味しそうな熱気) -->
  <path d="M25 21 C23 16, 27 14, 25 9" fill="none" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
  <path d="M33 19 C31 14, 35 11, 33 6" fill="none" stroke="#ffedd5" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
  <path d="M41 21 C43 16, 39 13, 41 8" fill="none" stroke="#fed7aa" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

  <!-- 漆器のどんぶり (和風漆塗り鉢) -->
  <path d="M12 28 C14 45, 23 52, 32 52 C41 52, 50 45, 52 28 Z" fill="url(#bowl-body)" stroke="#f97316" stroke-width="0.8"/>
  <!-- どんぶりの高台 (底の足) -->
  <path d="M25 51 L25 55 C27 56, 37 56, 39 55 L39 51 Z" fill="#450a0a" stroke="#f97316" stroke-width="0.6"/>

  <!-- どんぶりの縁・金彩ライン -->
  <ellipse cx="32" cy="28" rx="20" ry="5" fill="#7f1d1d" stroke="url(#soup-gold)" stroke-width="1.5"/>
  <!-- スープ・料理の盛り付け面 -->
  <ellipse cx="32" cy="28.5" rx="18" ry="4" fill="url(#soup-gold)"/>

  <!-- 具材: なると、海苔、煮卵 -->
  <!-- 海苔 -->
  <rect x="17" y="24" width="7" height="6" rx="0.5" fill="#0f172a" transform="rotate(-15 20 27)"/>
  <!-- 煮卵半身 -->
  <ellipse cx="28" cy="28.5" rx="4" ry="2.5" fill="#f8fafc"/>
  <ellipse cx="28.5" cy="28.5" rx="2.2" ry="1.5" fill="#ea580c"/>
  <!-- なると巻き (渦巻き) -->
  <circle cx="37" cy="28.5" r="3.2" fill="#ffffff"/>
  <path d="M37 27 C38 27, 39 28, 38 29 C37 30, 36 29, 36.5 28.5" fill="none" stroke="#ef4444" stroke-width="0.8"/>

  <!-- 塗り箸 (斜めに美しく配された箸) -->
  <line x1="8" y1="20" x2="52" y2="34" stroke="#450a0a" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="8" y1="20" x2="16" y2="22.5" stroke="#fbbf24" stroke-width="2.8" stroke-linecap="round"/>
  <line x1="12" y1="17" x2="55" y2="31" stroke="#450a0a" stroke-width="2" stroke-linecap="round"/>
  <line x1="12" y1="17" x2="20" y2="19.5" stroke="#fbbf24" stroke-width="2.2" stroke-linecap="round"/>
</svg>
