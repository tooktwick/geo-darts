<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="scroll-paper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#fcd34d"/>
    </linearGradient>
    <linearGradient id="scroll-wood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <linearGradient id="magatama-jade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="heritage-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#eab308" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景円 -->
  <circle cx="32" cy="32" r="30" fill="#171206" stroke="#eab308" stroke-width="2" filter="url(#heritage-glow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#facc15" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- 開かれた巻物 (和紙の質感) -->
  <!-- 巻紙本体 -->
  <path d="M16 20 C24 16, 40 24, 48 20 L48 44 C40 48, 24 40, 16 44 Z" fill="url(#scroll-paper)" stroke="#d97706" stroke-width="0.8"/>
  
  <!-- 左側の巻き軸 (木製軸棒) -->
  <rect x="13" y="15" width="4" height="34" rx="2" fill="url(#scroll-wood)" stroke="#f59e0b" stroke-width="0.6"/>
  <circle cx="15" cy="14" r="2.5" fill="#f59e0b"/>
  <circle cx="15" cy="50" r="2.5" fill="#f59e0b"/>

  <!-- 右側の巻き軸 -->
  <rect x="47" y="15" width="4" height="34" rx="2" fill="url(#scroll-wood)" stroke="#f59e0b" stroke-width="0.6"/>
  <circle cx="49" cy="14" r="2.5" fill="#f59e0b"/>
  <circle cx="49" cy="50" r="2.5" fill="#f59e0b"/>

  <!-- 巻物内の墨書 (歴史の文字・罫線) -->
  <line x1="22" y1="24" x2="42" y2="24" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 3"/>
  <line x1="22" y1="29" x2="40" y2="29" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="3 2"/>
  <line x1="22" y1="34" x2="42" y2="34" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="2 4"/>
  <line x1="22" y1="39" x2="36" y2="39" stroke="#78350f" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 2"/>

  <!-- 朱印 (落款印) -->
  <rect x="38" y="36" width="5" height="5" rx="1" fill="#dc2626" opacity="0.85"/>

  <!-- 勾玉 (古代の宝・歴史の象徴) -->
  <g transform="translate(40, 36) scale(0.65)">
    <path d="M12 2 C6 2, 2 7, 2 13 C2 21, 10 27, 18 29 C20 29, 21 27, 20 25 C17 21, 15 16, 17 12 C18 9, 20 8, 20 6 C20 4, 16 2, 12 2 Z" fill="url(#magatama-jade)" stroke="#ecfdf5" stroke-width="1.2"/>
    <circle cx="11" cy="8" r="2.5" fill="#0f172a"/>
  </g>
</svg>
