<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="tower-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="tower-deck" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <filter id="tower-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- 背景円 -->
  <circle cx="32" cy="32" r="30" fill="#031525" stroke="#38bdf8" stroke-width="2" filter="url(#tower-glow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#7dd3fc" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.5"/>

  <!-- 夜空の電波・光波 (同心円パルス) -->
  <circle cx="32" cy="11" r="5" fill="none" stroke="#38bdf8" stroke-width="0.6" opacity="0.4"/>
  <circle cx="32" cy="11" r="10" fill="none" stroke="#38bdf8" stroke-width="0.6" stroke-dasharray="2 2" opacity="0.3"/>
  <circle cx="32" cy="11" r="16" fill="none" stroke="#0284c7" stroke-width="0.6" stroke-dasharray="3 3" opacity="0.2"/>

  <!-- タワー アンテナ先端ピナクル -->
  <line x1="32" y1="6" x2="32" y2="17" stroke="#e0f2fe" stroke-width="1.5"/>
  <circle cx="32" cy="6" r="1.5" fill="#f43f5e"/> <!-- 航空障害灯の赤光 -->

  <!-- 特別展望台 (第2展望台) -->
  <ellipse cx="32" cy="19" rx="5" ry="2" fill="url(#tower-deck)" stroke="#38bdf8" stroke-width="0.5"/>
  <rect x="29" y="19" width="6" height="3" fill="#0f172a"/>

  <!-- メインタワー上部シャフト -->
  <polygon points="30,22 34,22 35,31 29,31" fill="url(#tower-grad)"/>

  <!-- 大展望台 (メインデッキ) -->
  <ellipse cx="32" cy="31" rx="10" ry="3.5" fill="url(#tower-deck)" stroke="#38bdf8" stroke-width="0.8"/>
  <rect x="25" y="31" width="14" height="4.5" rx="1" fill="#0f172a" stroke="#0284c7" stroke-width="0.5"/>
  <!-- デッキの窓の明かり -->
  <line x1="27" y1="33.2" x2="37" y2="33.2" stroke="#fde047" stroke-width="1.2" stroke-dasharray="1.5 1.5"/>

  <!-- タワー脚部 (トラスアーチ構造) -->
  <!-- 左脚 -->
  <path d="M26 35 L17 54 L22 54 L29 35 Z" fill="url(#tower-grad)"/>
  <!-- 右脚 -->
  <path d="M38 35 L47 54 L42 54 L35 35 Z" fill="url(#tower-grad)"/>
  <!-- 中央アーチ -->
  <path d="M22 54 Q32 44 42 54" fill="none" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- トラスブレース (斜交梁) -->
  <line x1="27" y1="39" x2="37" y2="39" stroke="#7dd3fc" stroke-width="0.8"/>
  <line x1="24" y1="45" x2="40" y2="45" stroke="#7dd3fc" stroke-width="0.8"/>
  <line x1="27" y1="39" x2="39" y2="45" stroke="#38bdf8" stroke-width="0.6"/>
  <line x1="37" y1="39" x2="25" y2="45" stroke="#38bdf8" stroke-width="0.6"/>

  <!-- 近代のきらめき星 (左右) -->
  <polygon points="15,18 16,21 19,22 16,23 15,26 14,23 11,22 14,21" fill="#fde047" opacity="0.9"/>
  <polygon points="48,22 49,24 51,25 49,26 48,28 47,26 45,25 47,24" fill="#38bdf8" opacity="0.8"/>
</svg>
