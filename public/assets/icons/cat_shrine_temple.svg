<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="torii-red" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="60%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="torii-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shrine-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#ef4444" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- 背景円 -->
  <circle cx="32" cy="32" r="30" fill="#0f172a" stroke="#dc2626" stroke-width="2" filter="url(#shrine-glow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#f87171" stroke-width="0.5" stroke-dasharray="2 2" opacity="0.6"/>

  <!-- 神光・背後の後光 -->
  <circle cx="32" cy="30" r="14" fill="#ef4444" opacity="0.15"/>

  <!-- 鳥居 笠木・島木 (最上部湾曲横木) -->
  <path d="M10 18 Q32 14 54 18 L55 22 Q32 18 9 22 Z" fill="url(#torii-red)" stroke="#fca5a5" stroke-width="0.5"/>
  <!-- 笠木両端の反り飾り -->
  <path d="M10 18 L8 16 L12 17 Z M54 18 L56 16 L52 17 Z" fill="url(#torii-red)"/>

  <!-- 貫 (下の横木) -->
  <rect x="13" y="27" width="38" height="4.5" rx="1" fill="url(#torii-red)" stroke="#7f1d1d" stroke-width="0.5"/>

  <!-- 額束 (中央の神額) -->
  <rect x="29" y="19" width="6" height="8.5" fill="#18181b" stroke="url(#torii-gold)" stroke-width="0.8"/>
  <rect x="30.5" y="21" width="3" height="4.5" fill="url(#torii-gold)"/>

  <!-- 柱 (左右の円柱) -->
  <!-- 左柱 -->
  <path d="M19 22 L17 54 L22 54 L23 22 Z" fill="url(#torii-red)" stroke="#7f1d1d" stroke-width="0.5"/>
  <!-- 右柱 -->
  <path d="M41 22 L42 54 L47 54 L45 22 Z" fill="url(#torii-red)" stroke="#7f1d1d" stroke-width="0.5"/>

  <!-- 柱の台石 (根巻石) -->
  <rect x="16" y="51" width="7" height="4" rx="1" fill="#18181b" stroke="url(#torii-gold)" stroke-width="0.6"/>
  <rect x="41" y="51" width="7" height="4" rx="1" fill="#18181b" stroke="url(#torii-gold)" stroke-width="0.6"/>

  <!-- 注連縄・紙垂 (しで) -->
  <path d="M22 29 Q32 34 42 29" stroke="url(#torii-gold)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <polygon points="26,31 28,31 29,36 27,36" fill="#f8fafc"/>
  <polygon points="31,32 33,32 34,37 32,37" fill="#f8fafc"/>
  <polygon points="36,31 38,31 39,36 37,36" fill="#f8fafc"/>
</svg>
